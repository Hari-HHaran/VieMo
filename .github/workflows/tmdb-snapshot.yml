# Saves a snapshot of real TMDB data into data/tmdb-snapshot.json so VieMo can run without a TMDB key.
# Setup once: repository Settings → Secrets and variables → Actions → New repository secret,
#   name TMDB_READ_TOKEN, value = TMDB → Settings → API → "API Read Access Token".
# Then: Actions → "TMDB snapshot" → Run workflow. Run it again whenever you want fresher data.
name: TMDB snapshot

on:
  workflow_dispatch:
    inputs:
      regions:
        description: Regions for where-to-watch and cinema lists (two-letter codes, comma-separated)
        default: SG
        required: true
      max_films:
        description: Most films to save
        default: '1500'
        required: true

permissions:
  contents: write

concurrency:
  group: tmdb-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the secret is set
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          if [ -z "$TMDB_READ_TOKEN" ]; then
            echo "::error::Add a repository secret named TMDB_READ_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Download from TMDB
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          SNAPSHOT_REGIONS: ${{ inputs.regions }}
          SNAPSHOT_MAX_FILMS: ${{ inputs.max_films }}
        run: node scripts/snapshot.mjs
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tmdb-snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Update TMDB snapshot"
            git push
          fi
