<div id="root"></div>

    h(V.Avatar, { name: 'Arjun Rao', size: 'md' }),

    h(V.Avatar, { name: 'Maya Tan', size: 'xs' }),
    h(V.Avatar, { name: 'Broken Image', size: 'md', src: 'data:image/png;base64,AA' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
