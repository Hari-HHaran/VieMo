<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rating — preview</title>
<style>body{padding:16px} .pv-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start} .pv-col{display:grid;gap:12px} .pv-label{margin:0 0 8px;color:var(--ink-muted)}</style>
</head>
<body>
<div id="root"></div>
<script>
var V = window.VieMo, h = React.createElement, useState = React.useState;
function Demo() {
  var r = useState(3.5), val = r[0], setVal = r[1];
  return h('div', { className: 'pv-col' },
    h('div', { className: 'pv-col', style: { gap: '10px' } },
      h(V.Rating, { value: 4.5, source: 'friend' }),
      h(V.Rating, { value: 3.8, source: 'community', count: 12 }),
      h(V.Rating, { source: 'community', count: 0 }),
      h(V.Rating, { value: 7.2, source: 'tmdb' })),
    h('div', null,
      h('p', { className: 'pv-label type-label', id: 'yr' }, 'Your rating'),
      h(V.Rating, { value: val, onChange: setVal, onClear: function () { setVal(null); }, label: 'Your rating for The Lantern Keeper' })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
