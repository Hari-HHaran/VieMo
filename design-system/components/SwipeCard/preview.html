<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SwipeCard — preview</title>
<style>body{padding:16px} .pv-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start} .pv-col{display:grid;gap:12px} .pv-label{margin:0 0 8px;color:var(--ink-muted)}</style>
</head>
<body>
<div id="root"></div>
<script>
var V = window.VieMo, h = React.createElement, useState = React.useState;
var stack = [
  { title: 'Nine Floors Down', year: 2017, runtime: 101, genres: ['Thriller', 'Horror'], synopsis: 'A night-shift engineer is trapped in a tower block whose lift keeps stopping on a floor that is not on the plans.', rating: { value: 6.9, source: 'tmdb' }, providers: [{ name: 'Netflix' }] },
  { title: 'Salt & Static', year: 2022, runtime: 94, genres: ['Comedy'], synopsis: 'Two rival late-night radio hosts are forced to share one studio and one terrible call-in show.', rating: { value: 7.1, source: 'tmdb' }, providers: [] },
  { title: 'The Lantern Keeper', year: 2019, runtime: 112, genres: ['Drama', 'Mystery'], synopsis: 'A retired lighthouse keeper returns to the island to find the light has been switched on every night without him.', rating: { value: 7.4, source: 'tmdb' }, providers: [{ name: 'Disney+' }, { name: 'Apple TV' }] }
];
function Demo() {
  var i = useState(0), idx = i[0], setIdx = i[1];
  var f = stack[idx % stack.length];
  return h('div', { style: { maxWidth: '380px', margin: '0 auto' } },
    h(V.SwipeCard, { key: idx, film: f, progress: { current: 4 + idx, total: 20 }, onVote: function () { setIdx(idx + 1); }, onDetails: function () {}, onTrailer: function () {} }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
